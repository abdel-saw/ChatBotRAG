server:
  port: 8080

spring:
  application:
    name: chatbotrag-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatbotrag}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024

logging:
  level:
    com.chatbotrag: INFO
    org.springframework.ai: INFO

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: 86400000


name: Backend document regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  document-handling:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: chatbotrag_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chatbotrag_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGVECTOR_TEST_URL: jdbc:postgresql://localhost:5432/chatbotrag_test
      PGVECTOR_TEST_USER: postgres
      PGVECTOR_TEST_PASSWORD: postgres
    defaults:
      run:
        working-directory: chatbotrag-backend
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: chatbotrag-backend/pom.xml
      - name: Run document and privacy regression checks
        run: bash mvnw -B -Dtest=DocumentServiceTest,ChatServiceTest,PgVectorDocumentDeletionTest,JwtUtilTest test


  docker-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: chatbotrag-backend
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test local credential generation
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Generate local configuration and validate Compose
        run: |
          python3 scripts/setup_local.py
          docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180 backend
      - name: Check registration and authenticated document access
        run: python3 scripts/smoke_backend.py
      - name: Stop the test stack
        if: always()
        run: docker compose down --volumes

